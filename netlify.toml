[build]
  command = "pnpm build && pnpm pagefind:build"
  publish = ".output/public"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"
  # Required env vars — set in Netlify UI → Site configuration → Environment variables:
  #   VITE_API_BASE_URL    public Strapi URL (also used by build scripts)
  #   API_BEARER_TOKEN     Strapi bearer token (build scripts)
  #   NUXT_API_TOKEN       same value as API_BEARER_TOKEN (Netlify Function runtime)
  #   NUXT_PREVIEW_SECRET  same value as PREVIEW_SECRET (Netlify Function runtime)

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://v2.hub.icjia-api.cloud"
    X-Frame-Options = "ALLOW-FROM https://v2.hub.icjia-api.cloud"
