[build]
  command = "pnpm build && pnpm pagefind:build"
  publish = ".output/public"

[build.environment]
  NITRO_PRESET = "static"
  NODE_VERSION = "22"
  # Required env vars — set in Netlify UI → Site configuration → Environment variables:
  #   VITE_API_BASE_URL    public Strapi URL (also used by build scripts)
  #   API_BEARER_TOKEN     Strapi bearer token (build scripts)
  #   NUXT_API_TOKEN       same value as API_BEARER_TOKEN (Netlify Function runtime)
  #   NUXT_PREVIEW_SECRET  preview token secret (Netlify Function runtime)
  #
  # Delete these if they exist — they trigger the secrets scanner:
  #   NUXT_STRAPI_URL, VITE_PREVIEW_SECRET, VITE_API_BEARER_TOKEN

# Route Strapi API calls to our standalone Netlify Function.
# Static files (pre-rendered pages) are always served from the CDN by Netlify
# before any redirect is evaluated, so this only fires for /api/strapi/* paths.
[[redirects]]
  from = "/api/strapi/*"
  to = "/.netlify/functions/strapi"
  status = 200

# Preview routes are handled client-side by Vue Router + preview-access middleware.
# Serve the SPA shell (200.html) so the router can take over without a flash of
# the pre-rendered home page (which index.html would cause, breaking hydration).
[[redirects]]
  from = "/preview/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/previewreadonly/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/appspreview/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/appspreviewreadonly/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/datasetpreview/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/datasetpreviewreadonly/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/projectspreview/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/projectspreviewreadonly/*"
  to = "/200.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://v2.hub.icjia-api.cloud"
    X-Frame-Options = "ALLOW-FROM https://v2.hub.icjia-api.cloud"
