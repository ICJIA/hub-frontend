<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Glow effect behind title area -->
  <ellipse cx="350" cy="280" rx="350" ry="200" fill="#22c55e" opacity="0.03"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- ICJIA badge -->
  <rect x="80" y="60" width="120" height="32" rx="6" fill="#22c55e" opacity="0.15"/>
  <text x="140" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="2">ICJIA</text>

  <!-- Title -->
  <text x="80" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">Research Hub</text>
  <text x="80" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="300" fill="#94a3b8">v2.0</text>

  <!-- Subtitle -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#64748b">Illinois Criminal Justice Information Authority</text>

  <!-- Divider line -->
  <rect x="80" y="330" width="80" height="3" rx="2" fill="url(#accent)"/>

  <!-- Three content cards -->

  <!-- Card 1: Articles -->
  <g transform="translate(80, 370)">
    <rect width="310" height="140" rx="12" fill="url(#card1)" stroke="#334155" stroke-width="1"/>
    <!-- Document icon -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="32" height="40" rx="4" fill="none" stroke="#22c55e" stroke-width="2"/>
      <line x1="8" y1="14" x2="24" y2="14" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="24" y2="22" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="30" x2="18" y2="30" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
      <path d="M20,0 L32,12 L20,12 Z" fill="#22c55e" opacity="0.3"/>
    </g>
    <text x="24" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Articles</text>
    <text x="24" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Research publications &amp; reports</text>
  </g>

  <!-- Card 2: Datasets -->
  <g transform="translate(420, 370)">
    <rect width="310" height="140" rx="12" fill="url(#card2)" stroke="#334155" stroke-width="1"/>
    <!-- Data/chart icon -->
    <g transform="translate(24, 24)">
      <rect x="0" y="24" width="8" height="16" rx="2" fill="#22c55e" opacity="0.6"/>
      <rect x="12" y="16" width="8" height="24" rx="2" fill="#22c55e" opacity="0.8"/>
      <rect x="24" y="8" width="8" height="32" rx="2" fill="#22c55e"/>
    </g>
    <text x="24" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Datasets</text>
    <text x="24" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Open data &amp; statistical resources</text>
  </g>

  <!-- Card 3: Applications -->
  <g transform="translate(760, 370)">
    <rect width="310" height="140" rx="12" fill="url(#card3)" stroke="#334155" stroke-width="1"/>
    <!-- App/grid icon -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#22c55e"/>
      <rect x="18" y="0" width="14" height="14" rx="3" fill="#22c55e" opacity="0.6"/>
      <rect x="0" y="18" width="14" height="14" rx="3" fill="#22c55e" opacity="0.6"/>
      <rect x="18" y="18" width="14" height="14" rx="3" fill="#22c55e" opacity="0.3"/>
    </g>
    <text x="24" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Applications</text>
    <text x="24" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Interactive tools &amp; dashboards</text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="555" width="1200" height="75" fill="#0f172a" opacity="0.5"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569" text-anchor="end">Illinois Statistical Analysis Center</text>
</svg>
